*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#132b4f}
.wrap{max-width:620px;margin:auto;padding:18px}.top{background:#132b4f;color:white;border-radius:16px;padding:20px;text-align:center}
.logo{width:70px;height:70px;object-fit:contain;background:white;border-radius:12px;padding:4px}

.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:18px;margin-top:14px}
label{display:block;font-size:12px;font-weight:700;color:#52708f;margin:12px 0 6px}

textarea{min-height:90px}button{width:100%;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:700;margin-top:10px}
.primary{background:#132b4f;color:#fff}.secondary{background:#eaf1f8;color:#132b4f}
.preview{margin-top:14px;background:white;border:1px solid #dce5ef;border-radius:16px;overflow:hidden}
.phead{padding:20px;border-bottom:1px solid #e6edf5}.body{padding:20px}.ref{background:#eef5fb;border-radius:10px;padding:13px;margin-top:15px}
.title{font-size:26px;font-weight:750;margin:5px 0 8px}.muted{color:#60748c;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.box{border-top:1px solid #edf1f5;padding-top:10px;font-size:14px}.box small{display:block;color:#52708f;font-weight:700;font-size:10px;margin-bottom:4px}
.status{background:#dff7e7;color:#13743a;padding:10px;border-radius:8px;margin-top:15px;font-weight:700}
.footer{text-align:center;background:#f8fafc;padding:16px;color:#60748c;font-size:12px}
.msg{text-align:center;color:#13743a;font-weight:700;margin-top:9px;min-height:18px}
</style>

<div class="card">
<label>Nombre del cliente</label><input id="name" value="">
<label>Número de reserva</label><input id="ref" value="RPT-0001">
<label>Destino</label><input id="dest" value="Cerro Negro, León">
<label>Fecha</label><input id="date" value="">
<label>Pasajeros</label><input id="people" value="">
<label>Punto de salida</label><input id="pickup" value="Managua, Nicaragua">
<label>Hora de salida</label><input id="time" value="">
<label>Total</label><input id="total" value="">
<label>Anticipo recibido</label><input id="paid" value="">
<label>Saldo pendiente</label><input id="balance" value="">
<label>Método de pago</label><input id="method" value="">
<label>Qué incluye</label><textarea id="includes">Transporte turístico
Guía turístico
Equipo para sandboarding
Entrada al complejo volcánico</textarea>
<label>Información importante</label><textarea id="notes">Presentate 15 minutos antes de la hora indicada.
Lleva ropa cómoda, zapatos cerrados, agua y protector solar.</textarea>

<button class="primary" onclick="copy()">📋 Copiar confirmación</button>
<button class="secondary" onclick="share()">📤 Compartir</button>
<div class="msg" id="msg"></div>
</div>

<div id="preview" class="preview"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function d(){return {name:$("name").value,ref:$("ref").value,dest:$("dest").value,date:$("date").value,people:$("people").value,pickup:$("pickup").value,time:$("time").value,total:$("total").value,paid:$("paid").value,balance:$("balance").value,method:$("method").value,includes:$("includes").value,notes:$("notes").value}}
function content(x){
let inc=x.includes.split(/\n+/).filter(Boolean).map(v=>"✓ "+esc(v)).join("<br>");
let notes=x.notes.split(/\n+/).filter(Boolean).map(v=>"• "+esc(v)).join("<br>");
return `<div class="phead"><b>RUTA PINOLERA TOURS</b><div style="font-size:11px;color:#60748c;margin-top:3px">Explora · Conoce · Viví Nicaragua</div></div>
<div class="body"><div style="font-size:11px;color:#52708f;font-weight:700;letter-spacing:1px">RESERVA CONFIRMADA</div>
<div class="title">¡Tu aventura está reservada!</div><div class="muted">Hola, <b>${esc(x.name)}</b>. Gracias por confiar en Ruta Pinolera Tours.</div>
<div class="ref"><small style="color:#52708f;font-weight:700">NÚMERO DE RESERVA</small><br><b style="font-size:21px">${esc(x.ref)}</b></div>
<div class="card" style="margin-top:15px"><div style="font-size:11px;color:#52708f;font-weight:700">DESTINO</div><div style="font-size:23px;font-weight:700;margin-top:4px">${esc(x.dest)}</div>
<div class="grid"><div class="box"><small>FECHA</small>${esc(x.date)}</div><div class="box"><small>PASAJEROS</small>${esc(x.people)}</div><div class="box"><small>SALIDA</small>${esc(x.pickup)}<br>${esc(x.time)}</div><div class="box"><small>TOTAL</small>${esc(x.total)}</div></div>
<div class="status">✓ RESERVA CONFIRMADA</div></div>
<div class="grid"><div class="card"><b>Detalles de pago</b><p>Total: <b>${esc(x.total)}</b><br>Anticipo: <b>${esc(x.paid)}</b><br>Saldo: <b>${esc(x.balance)}</b><br><small>${esc(x.method)}</small></p></div>
<div class="card"><b>Incluye</b><p style="font-size:14px;line-height:1.7">${inc}</p></div></div>
<div class="card"><b>Información importante</b><p class="muted" style="font-size:14px">${notes}</p></div>
</div><div class="footer">RUTA PINOLERA TOURS<br>Viaja cómodo, viaja seguro<br>WhatsApp · @rutapinoleratours</div>`;
}
function render(){$("preview").innerHTML=content(d())}
document.querySelectorAll("input,textarea").forEach(e=>e.addEventListener("input",render));render();
async function copy(){
let node=$("preview"), plain=node.innerText;
try{await navigator.clipboard.writeText(plain);$("msg").textContent="✓ Copiado. Ahora pegalo en Gmail."}
catch(e){$("msg").textContent="Mantené presionado el texto de abajo para copiarlo."}
}
async function share(){
let text=$("preview").innerText;
if(navigator.share){try{await navigator.share({title:"Confirmación Ruta Pinolera Tours",text:text})}catch(e){}}
else{await copy()}
}
</script>
</body></html>
